# Local development only. Not for the Oracle server. See infra/README.md.
name: veloraug-local

services:
  api:
    build:
      context: ../services/api
    image: veloraug-api:local
    # Passes the settings in services/api/.env, if it exists, as environment
    # variables. The app itself never reads .env, and .dockerignore keeps the
    # file out of the image.
    env_file:
      - path: ../services/api/.env
        required: false
    ports:
      # 127.0.0.1 keeps the API reachable from this computer only.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
