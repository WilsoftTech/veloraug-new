name: veloraug
description: "VeloraUG: a movie platform for web and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: 3.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_web_auth_2: 5.1.0
  http: ^1.6.0
  video_player: 2.14.1
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/tmdb_logo.png
