name: veloraug
description: "VeloraUG: Luganda-translated movies and series, by VJ, for web and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: 3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_web_auth_2: 5.1.0
  http: ^1.6.0
  # The version flutter_localizations pins.
  intl: any
  # Opens trailers on YouTube, outside the app.
  url_launcher: 6.3.3
  video_player: 2.14.1
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Generates AppLocalizations from lib/l10n/app_en.arb. See l10n.yaml.
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/tmdb_logo.png
