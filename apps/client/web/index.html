<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VeloraUG: a movie platform for web and Android.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VeloraUG">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>VeloraUG</title>
  <!-- Matches the app's canvas, so loading doesn't flash white. -->
  <style>
    html, body { background: #0E1014; }
    /* The mark and a turning ring while the app loads; removed on Flutter's
       first frame. Sizes match lib/widgets/startup_gate.dart, so the hand-over
       to Flutter's own startup screen doesn't jump. */
    #splash {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center; pointer-events: none;
    }
    #splash .mark { position: relative; width: 132px; height: 132px; }
    #splash img {
      position: absolute; left: 18px; top: 18px; width: 96px; height: 96px;
    }
    #splash .ring {
      position: absolute; inset: 0; box-sizing: border-box; border-radius: 50%;
      border: 3px solid #343A43; border-top-color: #7DB2FF;
      animation: splash-turn 1.2s linear infinite;
    }
    @keyframes splash-turn { to { transform: rotate(360deg); } }
    /* Reduced motion: a still ring, with no turning arc. */
    @media (prefers-reduced-motion: reduce) {
      #splash .ring { animation: none; border-top-color: #343A43; }
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="splash" role="progressbar" aria-label="Starting VeloraUG"
       aria-busy="true">
    <div class="mark"><span class="ring"></span><img src="icons/Icon-512.png" alt=""></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
